# PremiumFly configuration
# language: jp = Japanese, en = English (controls both built-in messages below)
language: en

flight:
  # Flying speed while PremiumFly is active (0.1 - 1.0, vanilla creative default is 0.1)
  speed: 0.2
  # How many ticks (20 ticks = 1 second) a player has after a real jump to double-jump into flight
  jump-window-ticks: 40
  # World names where PremiumFly is disabled even for eligible players (e.g. minigame arenas)
  disabled-worlds: []

effects:
  sound:
    enabled: true
    activate: ENTITY_ENDERMAN_TELEPORT
    deactivate: ENTITY_BAT_TAKEOFF
  particles:
    enabled: true
    activate: CLOUD

hints:
  jump-hint-enabled: true
  jump-hint-cooldown-seconds: 3

update-checker:
  enabled: true
  # Your project's slug or ID from its Modrinth page URL (modrinth.com/plugin/<this>)
  modrinth-id: pfly

metrics:
  # Master switch. Also requires a real plugin-id from https://bstats.org to actually send data.
  enabled: true
  plugin-id: 33440

messages:
  jp:
    no-permission: "<red>権限がありません。"
    player-not-found: "<red>プレイヤーが見つかりません。"
    reload-success: "<green>PremiumFly の設定をリロードしました。"
    already-enabled: "<yellow><player> にはすでに PremiumFly が付与されています。"
    already-disabled: "<yellow><player> にはすでに PremiumFly が付与されていません。"
    enabled-sender: "<green><player> に PremiumFly を付与しました。"
    enabled-target: "<green>PremiumFly が有効化されました！ジャンプ → 空中で再ジャンプで飛行できます。"
