name: PremiumFly
version: '${version}'
main: io.github.takkunlego0916.premiumFly.PremiumFly
api-version: '1.21'
load: STARTUP
authors: [ Takkunlego0916 ]
description: Adds Creative-style double-jump flight for selected players outside of Creative mode.
website: https://takkunlego0916.f5.si

commands:
  pfly:
    description: Manage PremiumFly access and settings.
    usage: /<command> <player> <enable|disable> | /<command> <reload|list|info|help>

permissions:
  pfly.admin:
    description: Allows use of all /pfly admin subcommands.
    default: op
  premiumfly.fly:
    description: Automatically grants double-jump flight without needing /pfly enable. Ideal for permission-plugin rank groups.
    default: false
  premiumfly.notify:
    description: Notifies the player on join when a newer version of PremiumFly is available.
    default: op
